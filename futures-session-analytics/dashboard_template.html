<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Futures Session Analytics</title><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script><style>body{font:14px system-ui;background:#0b1020;color:#dbe5f5;max-width:1100px;margin:auto;padding:22px}section{background:#121a2d;border:1px solid #26334d;border-radius:10px;padding:16px;margin:14px 0}.chart{height:300px}select{background:#111b30;color:white;padding:7px}</style></head><body><h1>Futures Session Analytics</h1><p>Interactive RTH → overnight research dashboard</p><section><label>Visible sessions <select id="window"><option value="all">All</option><option value="60">Last 60</option><option value="20">Last 20</option><option value="10">Last 10</option></select></label> <label>Strategy <select id="strategy"><option value="ols">OLS strategy</option><option value="long">Always long overnight</option></select></label><div id="stats"></div></section><section><h2>Equity and drawdown</h2><div id="equity" class="chart"></div></section><section><h2>Rolling RTH → overnight correlation</h2><div id="corr" class="chart"></div></section><script>const rows=__DATA__;const charts=[];const common={layout:{background:{color:'#121a2d'},textColor:'#dbe5f5'},grid:{vertLines:{color:'#26334d'},horzLines:{color:'#26334d'}}};function make(id){const c=LightweightCharts.createChart(document.getElementById(id),{...common,height:300,width:document.getElementById(id).clientWidth});charts.push(c);return c}const eq=make('equity'),corr=make('corr');const eqs=eq.addSeries(LightweightCharts.LineSeries,{color:'#38bdf8'}),cors=corr.addSeries(LightweightCharts.LineSeries,{color:'#f59e0b'});function curve(a,k){let v=1;return a.map(x=>{v*=1+x[k];return{time:x.time,value:v}})}function refresh(){let w=document.getElementById('window').value,a=w==='all'?rows:rows.slice(-Number(w)),k=document.getElementById('strategy').value==='ols'?'strategy_return':'overnight_return';eqs.setData(curve(a,k));cors.setData(a.filter(x=>x.corr_20!=null).map(x=>({time:x.time,value:x.corr_20})));document.getElementById('stats').textContent=`${a.length} sessions · ${k==='strategy_return'?'OLS strategy':'Always long overnight'} · latest correlation: ${a.at(-1)?.corr_20?.toFixed(3)??'n/a'}`;charts.forEach(c=>c.timeScale().fitContent())}document.querySelectorAll('select').forEach(x=>x.addEventListener('change',refresh));refresh();addEventListener('resize',()=>charts.forEach(c=>c.applyOptions({width:c.paneSize?.width||document.body.clientWidth-44})));</script></body></html>
